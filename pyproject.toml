[project]
name = "uber-nyc-pickups-pipeline"
version = "1.0.0"
description = "PostgreSQL pipeline, FastAPI metrics API and React dashboard for 4.5M Uber pickups in NYC (Apr-Sep 2014)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
